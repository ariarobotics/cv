name: Generate Lecture PDFs

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "docs/lectures/*.html"
      - ".github/workflows/render-course.yml"

permissions:
  contents: write

concurrency:
  group: lecture-pdf-generation
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start local website server
        shell: bash
        run: |
          python3 -m http.server 8000 --directory docs \
            > /tmp/cv-http.log 2>&1 &

          echo $! > /tmp/cv-http.pid

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              echo "Website server is ready."
              exit 0
            fi

            sleep 1
          done

          echo "Website server did not start."
          cat /tmp/cv-http.log
          exit 1

      - name: Generate lecture PDFs
        shell: bash
        run: |
          mkdir -p docs/lectures/pdf
          shopt -s nullglob

          files=(docs/lectures/[0-9][0-9]_*.html)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No lecture HTML files were found in docs/lectures/."
            echo "Available files:"
            find docs/lectures -maxdepth 1 -type f -print || true
            exit 1
          fi

          for html in "${files[@]}"; do
            filename=$(basename "$html" .html)

            echo "Generating PDF for ${filename}"

            npx --yes decktape reveal \
              --size=1600x900 \
              "http://127.0.0.1:8000/lectures/${filename}.html" \
              "docs/lectures/pdf/${filename}.pdf"
          done

      - name: Stop local website server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-http.pid ]; then
            kill "$(cat /tmp/cv-http.pid)" || true
          fi

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: lecture-pdfs
          path: docs/lectures/pdf/*.pdf
          if-no-files-found: error

      - name: Commit lecture PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f docs/lectures/pdf/*.pdf

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Update lecture PDFs [skip ci]"
            git push origin HEAD:main
          fi