name: Generate PDFs and Deploy Course Website

on:
  workflow_dispatch: {}

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  generate-pdfs:
    name: Generate lecture PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify lecture HTML files
        shell: bash
        run: |
          echo "Files in docs/lectures:"
          find docs/lectures -maxdepth 1 -type f -print || true

          shopt -s nullglob
          files=(docs/lectures/[0-9][0-9]_*.html)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: No lecture HTML files were found."
            echo "Expected files such as docs/lectures/01_intro.html."
            exit 1
          fi

          echo "Found ${#files[@]} lecture HTML file(s)."

      - name: Start local website server
        shell: bash
        run: |
          python3 -m http.server 8000 --directory docs \
            > /tmp/cv-http.log 2>&1 &

          echo $! > /tmp/cv-http.pid

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              echo "Website server is ready."
              exit 0
            fi

            echo "Waiting for website server..."
            sleep 1
          done

          echo "Error: Website server did not start."
          cat /tmp/cv-http.log
          exit 1

      - name: Generate lecture PDFs
        shell: bash
        run: |
          mkdir -p docs/lectures/pdf
          shopt -s nullglob

          files=(docs/lectures/[0-9][0-9]_*.html)

          for html in "${files[@]}"; do
            filename=$(basename "$html" .html)
            output="docs/lectures/pdf/${filename}.pdf"
            url="http://127.0.0.1:8000/lectures/${filename}.html"

            echo "Generating ${output}"

            npx --yes decktape reveal \
              --chrome-arg=--no-sandbox \
              --size=1600x900 \
              "$url" \
              "$output"
          done

          echo "Generated PDFs:"
          find docs/lectures/pdf -maxdepth 1 -type f -name "*.pdf" -print

      - name: Stop local website server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-http.pid ]; then
            kill "$(cat /tmp/cv-http.pid)" || true
          fi

      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lecture-pdfs
          path: docs/lectures/pdf/*.pdf
          if-no-files-found: error
          retention-days: 7

      # Publish the rendered website and freshly generated PDFs together.
      # This uploads a deployment artifact; it does not commit files to Git.
      - name: Upload complete website for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy course website
    needs: generate-pdfs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
