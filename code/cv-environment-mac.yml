name: cv

channels:
  - conda-forge

variables:
  PYTHONNOUSERSITE: "1"

dependencies:
  # Core Python
  - python=3.12
  - pip
  - setuptools
  - wheel

  # Scientific Python stack
  - numpy>=2.0,<3
  - scipy>=1.15,<2
  - pandas>=2.2,<4
  - matplotlib>=3.10,<4
  - pillow>=11,<13
  - scikit-image>=0.25,<1
  - scikit-learn>=1.7,<2
  - plotly>=6,<7
  - tqdm>=4.67,<5

  # Deep learning stack
  # Install from conda-forge on macOS so PyTorch and the scientific stack
  # use a consistent native dependency stack and avoid duplicate OpenMP runtimes.
  - pytorch=2.13.0
  - torchvision=0.28.0

  # Notebook / VS Code support
  - ipykernel
  - jupyterlab
  - notebook
  - ipywidgets

  # Packages installed from PyPI
  - pip:
      # Full OpenCV build, including contrib modules.
      - opencv-contrib-python==5.0.0.93

      - tensorboard

      # Interpretability / utilities used or potentially useful in course notebooks
      - lime
      - captum
